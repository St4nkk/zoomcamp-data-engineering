id: taxi_parent_loop
namespace: zoomcamp

inputs:
  - id: taxi
    type: MULTISELECT
    displayName: Select taxi types
    values: [ "yellow", "green" ]
    defaults: [ "green" ]

  - id: year
    type: MULTISELECT
    displayName: Select years
    values: [ "2019", "2020", "2021" ]
    defaults: [ "2020", "2021" ]

  - id: month
    type: MULTISELECT
    displayName: Select months
    values: [ "01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12" ]
    defaults: [ "01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12" ]

tasks:
  - id: taxi_loop_gcp
    type: io.kestra.plugin.core.flow.ForEach
    values: "{{inputs.taxi}}"
    tasks:
      - id: year
        type: io.kestra.plugin.core.flow.ForEach
        values: "{{inputs.year}}"
        tasks:
          - id: month
            type: io.kestra.plugin.core.flow.ForEach
            values: "{{inputs.month}}"
            tasks:
              - id: if_not_2021_after_07
                type: io.kestra.plugin.core.flow.If
                condition: "{{ not (parents[0].taskrun.value == '2021' and ['08', '09', '10', '11', '12'] contains taskrun.value) }}"
                then:
                - id: subflow_taxi
                  type: io.kestra.plugin.core.flow.Subflow
                  namespace: zoomcamp
                  flowId: child_taxi_gcp
                  inputs:
                    taxi: "{{parents[2].taskrun.value }}"
                    year: "{{parents[1].taskrun.value}}"
                    month: "{{parents[0].taskrun.value}}"


